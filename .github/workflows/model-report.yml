name: Model report

# Fetch the Artificial Analysis report once a week and rebuild
# plugins/phased-delivery/model-profiles.json (read by scripts/select-models.py).
# Commits model-report.json, model-report.md (for people) and the profiles only
# when the model list or a price changed, as the profiles fingerprint shows.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DIR: plugins/phased-delivery
    steps:
      - uses: actions/checkout@v4

      - name: Fetch report
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          python3 -I "$DIR/scripts/fetch-model-report.py" "$RUNNER_TEMP/report"

      - name: Rebuild profiles
        id: profiles
        run: |
          rc=0
          python3 -I "$DIR/scripts/select-models.py" profiles "$RUNNER_TEMP/report/model-report.json" "$DIR" || rc=$?
          # 0 changed (profiles written), 1 unchanged, anything else is an error
          case $rc in
            0) echo "changed=true" >> "$GITHUB_OUTPUT"
               cp "$RUNNER_TEMP/report/model-report.json" "$RUNNER_TEMP/report/model-report.md" "$DIR/" ;;
            1) ;;
            *) exit "$rc" ;;
          esac

      - name: Commit
        if: steps.profiles.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/model-report.json" "$DIR/model-report.md" "$DIR/model-profiles.json"
          git commit -m "model-report: refresh (models or prices changed)"
          git push
